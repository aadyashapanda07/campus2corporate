<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 20px;
        }

        .joke-box {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin: 30px 0;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-left: 5px solid #667eea;
        }

        .joke-text {
            font-size: 1.2em;
            color: #333;
            line-height: 1.6;
            font-weight: 500;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
            margin: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .joke-category {
            color: #667eea;
            font-size: 0.9em;
            margin-top: 15px;
            font-weight: 600;
        }

        @media (max-width: 600px) {
            .container {
                padding: 30px;
                margin: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .joke-text {
                font-size: 1em;
            }

            button {
                padding: 12px 30px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">😂</div>
        <h1>Joke Generator</h1>
        
        <div class="joke-box">
            <div id="jokeContainer" class="joke-text loading">Click a button to get a joke!</div>
        </div>

        <div class="button-group">
            <button onclick="getRandomJoke()">Get Random Joke</button>
            <button onclick="getJokeByType('general')">General Joke</button>
            <button onclick="getJokeByType('programming')">Programming Joke</button>
            <button onclick="getJokeByType('knock-knock')">Knock-Knock Joke</button>
        </div>

        <div id="category" class="joke-category"></div>
        <div id="errorContainer"></div>
    </div>

    <script>
        // Using the Official Joke API
        const JOKE_API_URL = 'https://official-joke-api.appspot.com';

        // Display loading state
        function showLoading() {
            const container = document.getElementById('jokeContainer');
            container.textContent = '⏳ Loading joke...';
            container.classList.add('loading');
            document.getElementById('category').textContent = '';
            document.getElementById('errorContainer').innerHTML = '';
        }

        // Display joke
        function displayJoke(setup, punchline, type = '') {
            const container = document.getElementById('jokeContainer');
            container.classList.remove('loading');
            container.innerHTML = `<strong>${setup}</strong><br><br>${punchline}`;
            
            if (type) {
                document.getElementById('category').textContent = `Category: ${type}`;
            }
        }

        // Display error
        function showError(error) {
            const errorContainer = document.getElementById('errorContainer');
            errorContainer.innerHTML = `<div class="error">❌ ${error}</div>`;
            const container = document.getElementById('jokeContainer');
            container.textContent = 'Failed to load joke. Please try again!';
            container.classList.remove('loading');
        }

        // Get random joke
        async function getRandomJoke() {
            showLoading();
            try {
                const response = await fetch(`${JOKE_API_URL}/random_joke`);
                if (!response.ok) throw new Error('Failed to fetch joke');
                
                const data = await response.json();
                displayJoke(data.setup, data.punchline, data.type);
            } catch (error) {
                showError(error.message);
            }
        }

        // Get joke by type
        async function getJokeByType(type) {
            showLoading();
            try {
                const response = await fetch(`${JOKE_API_URL}/jokes/${type}/random`);
                if (!response.ok) throw new Error(`Failed to fetch ${type} joke`);
                
                const data = Array.isArray(response) ? response[0] : await response.json();
                const jokeData = Array.isArray(data) ? data[0] : data;
                
                displayJoke(jokeData.setup, jokeData.punchline, jokeData.type);
            } catch (error) {
                showError(error.message);
            }
        }

        // Load a joke when page loads
        window.addEventListener('load', () => {
            getRandomJoke();
        });
    </script>
</body>
</html>
